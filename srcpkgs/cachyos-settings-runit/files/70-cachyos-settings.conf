# 70-cachyos-settings.conf — ported from CachyOS-Settings (init-agnostic)
# Source: https://github.com/CachyOS/CachyOS-Settings  (usr/lib/sysctl.d/99-cachyos-settings.conf)
# Safe on Void (runit) and Artix (runit/OpenRC). All values are plain kernel runtime tunables.

## ── Memory & I/O ─────────────────────────────────────────────
# Favor ZRAM (compressed swap) over reclaiming page cache.
vm.swappiness = 100
# Reclaim inodes/dentries less aggressively (keep FS metadata hot).
vm.vfs_cache_pressure = 50
# Bound dirty page writeback by absolute bytes (better latency than ratios).
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
# Disable readahead clustering for swap (ideal for ZRAM: 1 page at a time).
vm.page-cluster = 0

## ── Stability / latency ──────────────────────────────────────
# Drop the NMI watchdog: lower per-CPU overhead (fine for a desktop/gaming box).
kernel.nmi_watchdog = 0
# Don't stall on split-lock detection (some games/emulators trigger it).
kernel.split_lock_mitigate = 0

## ── Namespaces / security ────────────────────────────────────
# Needed by some sandboxes, Steam, Flatpak, browsers.
kernel.unprivileged_userns_clone = 1
# Hide kernel pointers from unprivileged users.
kernel.kptr_restrict = 2

## ── Logging / network ────────────────────────────────────────
# Quiet the console (keeps dmesg; just stops console spam).
kernel.printk = 3 3 3 3
# Deeper NIC backlog queue for high-throughput links.
net.core.netdev_max_backlog = 4096
# Raise the global open-file ceiling.
fs.file-max = 2097152

## ── Gaming-relevant extras (CachyOS sets these too) ──────────
# Many modern games (esp. via Proton) need a large mmap count.
vm.max_map_count = 1048576
# inotify headroom for big game libraries / file watchers.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288
# Faster dead-connection detection (CachyOS/systemd sets this separately).
net.ipv4.tcp_keepalive_time = 120
