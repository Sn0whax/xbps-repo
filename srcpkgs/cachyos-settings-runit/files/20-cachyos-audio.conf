# 20-cachyos-audio.conf — ported from CachyOS-Settings limits.d
# Lets the 'audio' group take realtime priority + high nice + lock memory.
# Needed for low-latency PipeWire/JACK and matches CachyOS's rtkit rtprio 99.
# Requires pam_limits (enabled by default on Void & Artix logins).

# <domain>   <type>  <item>    <value>
@audio       -       rtprio    99
@audio       -       nice      -20
@audio       -       memlock   unlimited
