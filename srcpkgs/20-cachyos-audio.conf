# 61-cachyos-misc.rules — device/power tuning (ported from CachyOS-Settings)
# init-agnostic; udev handles all of this. Comment out any block you don't want.

## ── SATA link power management: max performance ──────────────
# CachyOS forces max_performance on SATA hosts (desktop bias; costs idle power).
ACTION=="add", SUBSYSTEM=="scsi_host", KERNEL=="host*", ATTR{link_power_management_policy}="max_performance"

## ── HDD spin-down/APM tuning via hdparm ──────────────────────
# -B 254 (disable aggressive APM head-parking) / -S 0 (no spindown).
# Requires hdparm installed. Rotational ATA disks only.
ACTION=="add|change", KERNEL=="sd[a-z]", ATTR{queue/rotational}=="1", \
  RUN+="/usr/bin/hdparm -B 254 -S 0 /dev/%k"

## ── rtc0 / hpet accessible to 'audio' group (low-latency audio) ──
KERNEL=="rtc0", GROUP="audio"
KERNEL=="hpet", GROUP="audio"

## ── cpu_dma_latency accessible (game-performance / PM-QoS) ───
DEVPATH=="/devices/virtual/misc/cpu_dma_latency", OWNER="root", GROUP="audio", MODE="0660"

## ── Bump swappiness to 150 the moment ZRAM comes online ──────
# Anonymous pages compress cheaply into ZRAM, so lean on it harder.
ACTION=="change", KERNEL=="zram0", ATTR{initstate}=="1", \
  RUN+="/usr/bin/sysctl -q vm.swappiness=150"

## ── NVIDIA GPU runtime power management on bind/unbind ───────
# Enable RTD3 runtime PM when the nvidia driver binds (harmless on desktop).
ACTION=="bind", SUBSYSTEM=="pci", DRIVERS=="nvidia", ATTR{power/control}="auto"
ACTION=="unbind", SUBSYSTEM=="pci", DRIVERS=="nvidia", ATTR{power/control}="on"
