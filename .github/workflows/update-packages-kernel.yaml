name: Update Kernel & Heavy Packages
on:
  schedule:
    - cron: "23 4 * * *"      # daily 04:23 UTC
  workflow_dispatch:
concurrency: { group: update-package-templates, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.CI_PAT }}

      - name: Detect & bump heavy packages
        run: |
          set -u
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT

          # bump <pkg> <version> [revision]
          #   - version : new upstream version string
          #   - revision: optional; defaults to 1. Pass CachyOS pkgrel here so
          #               same-version rebuilds (e.g. -2 NVIDIA rebuilds) trigger.
          bump() {
            local pkg="$1" v="$2" rev="${3:-1}" t="srcpkgs/$1/template"
            [ -n "$v" ] || { echo "$pkg: no version detected — skip"; return 0; }
            [ -f "$t" ] || { echo "$pkg: template missing ($t) — skip"; return 0; }

            local cur_v cur_r
            cur_v="$(sed -n 's/^version=//p' "$t")"
            cur_r="$(sed -n 's/^revision=//p' "$t")"

            # Compare the FULL version-revision, not just version, so a
            # same-version pkgrel bump is not silently treated as up-to-date.
            if [ "$v" = "$cur_v" ] && [ "$rev" = "$cur_r" ]; then
              echo "$pkg: up-to-date ($cur_v-$cur_r)"
              return 0
            fi

            # Expand the template's distfiles URL against the NEW version so we
            # fetch the correct tarball to checksum. NOTE: kernel templates also
            # depend on _srcrel (the CachyOS SOURCE-tag rel), which bump_kernel
            # has already written before calling us, so ${_srcname} expands to a
            # tag that actually exists.
            local url u
            url="$(
              eval "$(grep -E '^(version|revision|_[A-Za-z0-9_]+)=' "$t" \
                      | sed "s/^version=.*/version=$v/")"
              u="$(sed -n 's/^distfiles=//p' "$t" | head -1 | tr -d '\"')"
              eval "u=\"$u\""
              printf '%s' "$u"
            )"

            if ! curl --retry 4 --retry-all-errors -fL "$url" -o "$tmp/$pkg.src"; then
              echo "$pkg: fetch failed ($url) — skip"
              return 0
            fi

            local sum; sum="$(sha256sum "$tmp/$pkg.src" | awk '{print $1}')"

            # version/revision are single, unquoted lines — safe to line-sed.
            sed -i \
              -e "s/^version=.*/version=$v/" \
              -e "s/^revision=.*/revision=$rev/" \
              "$t"

            # checksum may be a MULTI-LINE, quoted, dual-distfile block
            # (kernel + nvidia). Replace ONLY the first sha256 inside the
            # checksum="..." block — keep the quotes and the nvidia hash.
            # bump_nvopen.py owns the second (nvidia) checksum.
            awk -v new="$sum" '
              !done {
                if (!inblk && $0 ~ /^checksum="/) inblk=1
                if (inblk && match($0, /[0-9a-f]{64}/)) {
                  $0 = substr($0,1,RSTART-1) new substr($0,RSTART+RLENGTH)
                  done=1
                }
              }
              { print }
            ' "$t" > "$t.awk" && mv "$t.awk" "$t"

            echo "$pkg: BUMPED $cur_v-$cur_r -> $v-$rev  (sum $sum)"
          }

          # ---- CachyOS kernel: FOLLOW what CachyOS ships PER-ARCH ----------
          # Each template mirrors exactly what CachyOS publishes to ITS repo:
          #   linux-cachyos    -> base x86_64  repo  (may lag, e.g. 7.1.6-1)
          #   linux-cachyos-v3 -> x86_64_v3    repo  (leads,   e.g. 7.1.8-1)
          # Never take "newest across repos" — that would drag the generic
          # build ahead of what CachyOS actually validates for base hardware.
          # detect_repo <arch> <repo> : prints released linux-cachyos <ver>-<rel>
          detect_repo() {
            local arch="$1" repo="$2"; local db="$tmp/$repo.db"
            curl -fsSL --max-time 30 "https://cdn77.cachyos.org/repo/$arch/$repo/$repo.db" -o "$db" \
              || { echo "" ; return 0; }
            { tar tf "$db" 2>/dev/null \
                || zstdcat "$db" 2>/dev/null | tar tf - 2>/dev/null \
                || gzip -dc "$db" 2>/dev/null | tar tf - 2>/dev/null; } \
              | grep -oP '^linux-cachyos-\K[0-9][0-9.]*-[0-9]+(?=/)' \
              | sort -Vu | tail -n1
          }

          # ---- CachyOS SOURCE-tag resolver --------------------------------
          # The pacman repo rel (pkgrel) is NOT the same as the git SOURCE tag
          # rel: CachyOS does same-version package rebuilds (-2/-3 NVIDIA/
          # toolchain rebuilds) that ship NO new kernel source tag. So the
          # source tag can lag the pkgrel (e.g. repo says 7.2.4-3 but the only
          # tag on CachyOS/linux is cachyos-7.2.4-1).
          #
          # detect_srcrel <version> : print the HIGHEST source-tag rel that
          # actually EXISTS on CachyOS/linux for this version, else nothing.
          # Value is DISCOVERED at runtime — never hardcoded.
          #
          # Uses `git ls-remote` (a cheap ref listing) — NOT a tarball download.
          # The kernel source tarballs are ~200MB; probing them with curl would
          # time out and falsely report "tag missing", leaving _srcrel empty
          # (which produced the cachyos-<ver>-.tar.gz 404). ls-remote lists refs
          # only, so it's fast and reliable. Dots in <version> are escaped so a
          # tag like 7.2.4 can't accidentally match unrelated refs.
          detect_srcrel() {
            local ver="$1"
            git ls-remote --tags --refs https://github.com/CachyOS/linux 2>/dev/null \
              | grep -oP "refs/tags/cachyos-${ver//./\\.}-\K[0-9]+" \
              | sort -n | tail -n1
          }

          # bump_kernel <pkg> <repo-tag ver-pkgrel>
          # Resolves the real SOURCE-tag rel, writes it to _srcrel (upsert: it
          # inserts the line after revision= if the template doesn't have one
          # yet, so nothing needs to be seeded by hand), then calls bump() with
          # the pkgrel as the XBPS revision so same-version rebuilds still fire.
          bump_kernel() {
            local pkg="$1" tag="$2" t="srcpkgs/$1/template"
            [ -n "$tag" ] || { echo "$pkg: repo unreachable — skip"; return 0; }
            [ -f "$t" ] || { echo "$pkg: template missing ($t) — skip"; return 0; }

            local ver="${tag%-*}" pkgrel="${tag##*-}" srcrel
            srcrel="$(detect_srcrel "$ver")"
            if [ -z "$srcrel" ]; then
              echo "::warning::$pkg: no existing CachyOS source tag for $ver — skip"
              return 0
            fi

            # CI AUTHORS _srcrel (upsert). This is the ONLY writer of the value.
            if grep -q '^_srcrel=' "$t"; then
              sed -i "s/^_srcrel=.*/_srcrel=$srcrel/" "$t"
            else
              sed -i "/^revision=/a _srcrel=$srcrel" "$t"
            fi

            echo "$pkg: source tag cachyos-$ver-$srcrel  (revision/pkgrel=$pkgrel)"
            bump "$pkg" "$ver" "$pkgrel"
          }

          base_tag="$(detect_repo x86_64    cachyos)"
          v3_tag="$(detect_repo x86_64_v3 cachyos-v3)"
          echo "CachyOS base   repo: linux-cachyos ${base_tag:-<none>}"
          echo "CachyOS v3     repo: linux-cachyos ${v3_tag:-<none>}"
          if [ -z "$base_tag" ] && [ -z "$v3_tag" ]; then
            echo "::error::Could not detect any released CachyOS kernel"
            exit 1
          fi

          bump_kernel linux-cachyos    "$base_tag"
          bump_kernel linux-cachyos-v3 "$v3_tag"

          # ---- nlohmann-json ----
          jv="$(git ls-remote --tags --refs https://github.com/nlohmann/json \
                | grep -oP 'refs/tags/v\K[0-9.]+' | sort -V | tail -1)"
          bump nlohmann-json "$jv"

          # ---- NVIDIA production driver ----
          # NVIDIA occasionally republishes a newly released .run file at the
          # same versioned URL. A checksum calculated immediately at release may
          # therefore become invalid several hours later.
          #
          # NVIDIA source stabilization gate:
          #   Run 1: record the detected version and actual downloaded SHA-256.
          #   Run 2: update the template only if version and SHA-256 are unchanged.
          #
          # The state file is tracked by Git. A state-only commit does not trigger
          # build.yaml because that workflow watches only srcpkgs/**.
          nv="$(curl -fsSL 'https://forums.developer.nvidia.com/t/current-graphics-driver-releases/28500'                 | grep -oP 'Current production branch release: \K[0-9.]+(?= \(x86)' | head -1)"

          nv_template="srcpkgs/nvidia/template"
          nv_state=".github/state/nvidia-source"
          nv_current="$(sed -n 's/^version=//p' "$nv_template")"

          if [ -z "$nv" ]; then
            echo "::warning::NVIDIA production version detection failed — skip"
          elif [ "$nv" = "$nv_current" ]; then
            echo "nvidia: up-to-date ($nv_current)"
          else
            nv_url="https://us.download.nvidia.com/XFree86/Linux-x86_64/${nv}/NVIDIA-Linux-x86_64-${nv}.run"
            nv_archive="$tmp/NVIDIA-Linux-x86_64-${nv}.run"

            echo "nvidia: candidate $nv"
            echo "nvidia: downloading $nv_url"

            if ! curl                  --fail                  --show-error                  --location                  --retry 5                  --retry-all-errors                  --retry-delay 5                  --connect-timeout 30                  --speed-time 60                  --speed-limit 1024                  "$nv_url"                  -o "$nv_archive"; then
              echo "::warning::nvidia: candidate download failed — skip"
            else
              nv_size="$(stat -c %s "$nv_archive")"
              nv_sum="$(sha256sum "$nv_archive" | awk '{print $1}')"
              seen_v=""
              seen_sum=""

              if [ -f "$nv_state" ]; then
                read -r seen_v seen_sum < "$nv_state" || true
              fi

              if [ "$nv_size" -lt 100000000 ]; then
                echo "::warning::nvidia: candidate file is unexpectedly small ($nv_size bytes) — skip"
              elif ! [[ "$nv_sum" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::warning::nvidia: invalid SHA-256 result — skip"
              elif [ "$seen_v" = "$nv" ] && [ "$seen_sum" = "$nv_sum" ]; then
                echo "nvidia: source stabilized across consecutive runs"
                echo "nvidia: stable version $nv"
                echo "nvidia: stable checksum $nv_sum"

                sed -i                   -e "s/^version=.*/version=$nv/"                   -e 's/^revision=.*/revision=1/'                   -e 's|http://us\.download\.nvidia\.com|https://us.download.nvidia.com|g'                   -e "s/^checksum=.*/checksum=$nv_sum/"                   "$nv_template"

                printf '%s %s
' "$nv" "$nv_sum" > "$nv_state"
                echo "nvidia: BUMPED $nv_current -> $nv (stable sum $nv_sum)"
              else
                mkdir -p "$(dirname "$nv_state")"
                printf '%s %s
' "$nv" "$nv_sum" > "$nv_state"
                echo "nvidia: first observation recorded"
                echo "nvidia: version $nv"
                echo "nvidia: checksum $nv_sum"
                echo "nvidia: deferring template bump until the next scheduled run"
              fi
            fi
          fi

          # keep the open kernel module (kernel subpackage) in lockstep w/ driver
          if [ -n "$nv" ] && curl -fsSL -o "$tmp/nvopen.tgz" \
               "https://github.com/NVIDIA/open-gpu-kernel-modules/archive/refs/tags/${nv}.tar.gz"; then
            nvsum="$(sha256sum "$tmp/nvopen.tgz" | awk '{print $1}')"
            python3 .github/scripts/bump_nvopen.py "$nv" "$nvsum" \
              srcpkgs/linux-cachyos/template srcpkgs/linux-cachyos-v3/template || true
          fi

          # ---- Honest change detection: git is the ONLY source of truth ----
          # Never trust exit codes of sub-scripts (bump_nvopen.py exits 0 even
          # when it skips). A change is real only if a tracked file differs.
          if git diff --quiet; then
            changed=0
            echo "RESULT: nothing changed on disk — no build needed"
          else
            changed=1
            echo "RESULT: templates changed — a build should follow"
            echo "----- diff summary -----"
            git --no-pager diff --stat
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
        id: bump

      - name: Validate changed XBPS templates
        if: steps.bump.outputs.changed == '1'
        shell: bash
        run: |
          set -uo pipefail
          failed=0

          while IFS= read -r template; do
            [ -n "$template" ] || continue

            case "$template" in
              srcpkgs/*/template)
                echo "Validating $template"

                # Capture bash's actual error so the log points at the line,
                # not just "Invalid XBPS template syntax".
                if ! err="$(bash -n "$template" 2>&1)"; then
                  echo "::error file=$template::$err"
                  ln="$(sed -n 's/.*: line \([0-9]*\):.*/\1/p' <<<"$err" | head -1)"
                  if [ -n "$ln" ]; then
                    echo "----- context around line $ln -----"
                    awk -v L="$ln" 'NR>=L-6 && NR<=L+2{printf "%5d%s %s\n",NR,(NR==L?">>":"  "),$0}' "$template"
                  fi
                  failed=1
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR)

          if [ "$failed" -ne 0 ]; then
            echo "::error::Refusing to commit malformed XBPS templates"
            exit 1
          fi

      - name: Commit updates
        if: steps.bump.outputs.changed == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No file changes to commit (checksums identical)."
          else
            git commit -am "auto: bump kernel/heavy packages"
            git push
            echo "Committed and pushed template bumps."
          fi
